spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:project_drink}?sslmode=${DB_SSLMODE:disable}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
server.forward-headers-strategy=native
server.port=${PORT:8080}

# Comma-separated frontend origins. Set CORS_ALLOWED_ORIGINS on Railway.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|login/oauth2|oauth2)/ {
        # Railway private DNS. Keeping API traffic behind the frontend domain
        # makes the HttpOnly refresh cookie first-party in production.
        proxy_pass http://backend.railway.internal:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /;

        # Tăng timeout để tránh lỗi khi request xử lý lâu
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }
}

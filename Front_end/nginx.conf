server {
    listen 80;
    server_name coffeweb.duckdns.org;

    # Cấu hình gốc cho frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API và OAuth2 chung một block để quản lý header đồng nhất
    # Dùng regex để khớp cả /api/ và các đường dẫn oauth2
    location ~ ^/(api|login/oauth2|oauth2)/ {
        proxy_pass http://backend:8080;
        
        # CÁC HEADER QUAN TRỌNG ĐỂ BACKEND NHẬN DIỆN ĐÚNG URL
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Tăng thời gian timeout nếu cần
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
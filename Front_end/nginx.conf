server {
    listen 80;
    server_name coffeweb.duckdns.org;

    # 1. Định tuyến cho API và các luồng Backend (OAuth2, PayOS, v.v.)
    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params; # Nếu không có file này, hãy dùng các dòng bên dưới
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Định tuyến cho Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 80;
    server_name coffeweb.duckdns.org;

    # 1. Định tuyến cho Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Định tuyến cho API, OAuth2 và PayOS
    # Dùng location chung cho backend để dễ quản lý và tránh thiếu header
    location ~ ^/(api|login/oauth2|oauth2)/ {
        proxy_pass http://backend:8080;
        
        # Các header cần thiết để Backend nhận diện đúng domain và giao thức
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Tăng timeout để tránh lỗi khi request xử lý lâu (ví dụ: gọi AI hoặc thanh toán)
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
}